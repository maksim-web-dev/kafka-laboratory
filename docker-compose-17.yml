name: branch17

services:

  kafka:
    image: confluentinc/cp-kafka:8.0.1
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=4L6g3nShT-eMCtK-b17Zsw
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=branch01
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_1_NAME=branch02
      - KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_2_NAME=branch03
      - KAFKA_CLUSTERS_2_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_3_NAME=branch04
      - KAFKA_CLUSTERS_3_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_4_NAME=branch05
      - KAFKA_CLUSTERS_4_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_5_NAME=branch06
      - KAFKA_CLUSTERS_5_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_6_NAME=branch07
      - KAFKA_CLUSTERS_6_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_7_NAME=branch08
      - KAFKA_CLUSTERS_7_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_8_NAME=branch09
      - KAFKA_CLUSTERS_8_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_9_NAME=branch10
      - KAFKA_CLUSTERS_9_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_10_NAME=branch11
      - KAFKA_CLUSTERS_10_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_10_SCHEMAREGISTRY=http://schema-registry-b11:8081
      - KAFKA_CLUSTERS_11_NAME=branch12
      - KAFKA_CLUSTERS_11_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_11_SCHEMAREGISTRY=http://schema-registry-b12:8081
      - KAFKA_CLUSTERS_12_NAME=branch13
      - KAFKA_CLUSTERS_12_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_12_SCHEMAREGISTRY=http://schema-registry-b13:8081
      - KAFKA_CLUSTERS_13_NAME=branch14
      - KAFKA_CLUSTERS_13_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_13_SCHEMAREGISTRY=http://schema-registry-b14:8081
      - KAFKA_CLUSTERS_14_NAME=branch15
      - KAFKA_CLUSTERS_14_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_15_NAME=branch16
      - KAFKA_CLUSTERS_15_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_CLUSTERS_16_NAME=branch17
      - KAFKA_CLUSTERS_16_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  kafka-exporter-b17:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter-b17
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9308/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus-b17:
    image: prom/prometheus:latest
    container_name: prometheus-b17
    ports:
      - "9090:9090"
    volumes:
      - ./branch17_observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      kafka-exporter-b17:
        condition: service_healthy

  grafana-b17:
    image: grafana/grafana:latest
    container_name: grafana-b17
    ports:
      - "3017:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./branch17_observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./branch17_observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus-b17

  order-service:
    build: branch17_observability/order-service
    container_name: order-service-b17
    ports:
      - "8184:8184"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  notification-service:
    build: branch17_observability/notification-service
    container_name: notification-service-b17
    ports:
      - "8185:8185"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

networks:
  default:
    external: true
    name: kafka-lab