name: branch18

services:

  kafka:
    image: confluentinc/cp-kafka:8.0.1
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:SASL_PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      - KAFKA_SUPER_USERS=User:admin
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=4L6g3nShT-eMCtK-b18Zsw
      - KAFKA_OPTS=-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
    ports:
      - "9092:9092"
    volumes:
      - ./branch18_security/kafka:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/admin.conf --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  acl-init:
    image: confluentinc/cp-kafka:8.0.1
    container_name: acl-init-b18
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./branch18_security/kafka:/etc/kafka/secrets:ro
    entrypoint: ["/bin/bash", "/etc/kafka/secrets/acl-init.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=branch01
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_1_NAME=branch02
      - KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_2_NAME=branch03
      - KAFKA_CLUSTERS_2_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_3_NAME=branch04
      - KAFKA_CLUSTERS_3_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_4_NAME=branch05
      - KAFKA_CLUSTERS_4_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_5_NAME=branch06
      - KAFKA_CLUSTERS_5_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_6_NAME=branch07
      - KAFKA_CLUSTERS_6_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_7_NAME=branch08
      - KAFKA_CLUSTERS_7_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_8_NAME=branch09
      - KAFKA_CLUSTERS_8_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_9_NAME=branch10
      - KAFKA_CLUSTERS_9_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_10_NAME=branch11
      - KAFKA_CLUSTERS_10_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_10_SCHEMAREGISTRY=http://schema-registry-b11:8081
      - KAFKA_CLUSTERS_11_NAME=branch12
      - KAFKA_CLUSTERS_11_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_11_SCHEMAREGISTRY=http://schema-registry-b12:8081
      - KAFKA_CLUSTERS_12_NAME=branch13
      - KAFKA_CLUSTERS_12_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_12_SCHEMAREGISTRY=http://schema-registry-b13:8081
      - KAFKA_CLUSTERS_13_NAME=branch14
      - KAFKA_CLUSTERS_13_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_13_SCHEMAREGISTRY=http://schema-registry-b14:8081
      - KAFKA_CLUSTERS_14_NAME=branch15
      - KAFKA_CLUSTERS_14_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_15_NAME=branch16
      - KAFKA_CLUSTERS_15_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_CLUSTERS_16_NAME=branch17
      - KAFKA_CLUSTERS_16_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_17_NAME=branch18
      - KAFKA_CLUSTERS_17_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_17_PROPERTIES_SECURITY_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLUSTERS_17_PROPERTIES_SASL_MECHANISM=PLAIN
      - KAFKA_CLUSTERS_17_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    build: branch18_security/order-service
    container_name: order-service-b18
    ports:
      - "8187:8187"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="order-producer" password="order-secret";
    depends_on:
      acl-init:
        condition: service_completed_successfully

  notification-service:
    build: branch18_security/notification-service
    container_name: notification-service-b18
    ports:
      - "8188:8188"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="notification-consumer" password="notif-secret";
    depends_on:
      acl-init:
        condition: service_completed_successfully

networks:
  default:
    external: true
    name: kafka-lab