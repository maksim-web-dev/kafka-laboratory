server:
  port: 8169

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9117,localhost:9118,localhost:9119}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Producer waits for all ISR to acknowledge
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Short timeout so NotEnoughReplicasException surfaces quickly in demos
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000