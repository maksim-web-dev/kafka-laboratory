server:
  port: 8126

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9112}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8125}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    admin:
      auto-create: false

kafka:
  topics:
    orders-created: 11.orders.created
    orders-cancelled: 11.orders.cancelled